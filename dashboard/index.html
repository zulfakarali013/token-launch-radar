<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<link rel="stylesheet" href="radar.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="8"/><path d="M16 16 L27 8"/><circle class="blip" cx="22" cy="11" r="2.2"/></svg>
    <div><h1>Token Launch Radar</h1><p id="sub"></p></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="board">Pre-token board <b id="nb"></b></button>
    <button data-tab="method">Evidence &amp; method</button>
    <button data-tab="comps">Comparables <b id="nc"></b></button>
  </nav>
  <p class="meta" id="meta"></p>
</header>
<main>
  <section id="board" class="pane">
    <div class="kpis" id="kpis"></div>
    <div class="card" id="acct"></div>
    <div class="card formula" id="formula"></div>
    <div class="card evid" id="evid"></div>
    <div class="controls" id="controls">
      <div class="seg" id="calls"></div>
      <div class="seg" id="tiers"></div>
      <input id="q" type="search" placeholder="Search name, category, chain" aria-label="Search">
      <select id="cat" aria-label="Category"></select>
      <select id="chain" aria-label="Chain"></select>
      <span class="sep"></span>
      <label>Deposit <select id="dep" aria-label="Deposit"></select></label>
      <label>Drop share <input id="sh" type="range" min="1" max="20" step="0.5"> <b id="shv"></b></label>
      <label>Hold <select id="wk" aria-label="Weeks held"></select></label>
      <label>T-bill <select id="tb" aria-label="T-bill yield"></select></label>
      <button id="reset">Reset</button>
      <button id="sum">Hide summary</button>
      <button id="csv">CSV</button>
      <button id="json">JSON</button>
    </div>
    <p class="count" id="count"></p>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>
  <section id="detail" class="pane"></section>
  <section id="method" class="pane"></section>
  <section id="comps" class="pane"></section>
</main>
<script src="../data.js"></script>
<script src="radar.js"></script>
</body>
</html>
