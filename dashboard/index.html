<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="detail.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="8"/><path d="M16 16 L27 8"/><circle class="blip" cx="22" cy="11" r="2.2"/></svg>
    <div><h1>Token Launch Radar</h1><p id="sub"></p></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="board">Pre-token board <b id="nb"></b></button>
    <button role="tab" data-tab="method">Evidence &amp; method</button>
    <button role="tab" data-tab="comps">Comparables <b id="nc"></b></button>
  </nav>
  <p class="meta" id="meta"></p>
</header>
<main>
  <section id="board" class="pane">
    <div class="kpis" id="kpis"></div>
    <div class="card" id="acct"></div>
    <div class="card formula" id="formula"></div>
    <div class="card evid" id="evid"></div>
    <div class="controls">
      <div class="seg" id="calls" aria-label="Verdict"></div>
      <div class="seg" id="tiers" aria-label="Tier"></div>
      <input id="q" type="search" placeholder="Search name, category, chain  (/)" aria-label="Search">
      <select id="cat" aria-label="Category"></select>
      <select id="chain" aria-label="Chain"></select>
      <span class="sep"></span>
      <label>Deposit <select id="dep"></select></label>
      <label>Drop share <input id="sh" type="range" min="1" max="20" step="0.5"> <b id="shv"></b></label>
      <label>Hold <select id="wk"></select></label>
      <label>T-bill <select id="tb"></select></label>
      <button id="reset">Reset</button>
      <button id="sum">Hide summary</button>
      <button id="csv">CSV</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <p class="vleg" id="vleg"></p>
    <div class="tray" id="cmpbar"></div>
    <dialog id="cmp" class="card cmp" aria-label="Compare pinned"></dialog>
    <div class="card" id="wlbar"></div>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>
  <section id="detail" class="pane"></section>
  <section id="method" class="pane"></section>
  <section id="comps" class="pane"></section>
</main>
<script src="../data.js"></script>
<script src="format.js"></script>
<script src="model.js"></script>
<script src="state.js"></script>
<script src="chart.js"></script>
<script src="cover.js"></script>
<script src="board.js"></script>
<script src="compare.js"></script>
<script src="sandbox.js"></script>
<script src="detail.js"></script>
<script src="method.js"></script>
<script src="app.js"></script>
</body>
</html>
